<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - DR Tecnologia</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3BP31KQYPR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-3BP31KQYPR');
    </script>


    <!-- Favicon -->
    <link rel="icon" href="img/logo.png" type="image/png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header header-transparent">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-full">DR Tecnologia</span>
                <span class="logo-short">DR</span>
            </a>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="servicos.html">Serviços</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero-video">
        <video autoplay muted loop playsinline>
            <source src="videos/background_movel.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <section class="contato container">
                <h2 style="text-align:center;">Solicitação de Orçamento</h2>

                <p style="text-align:center; margin-bottom: 30px;">
                    Preencha o formulário abaixo e nossa equipe entrará em contato.
                </p>

                <form class="contato-form" id="form-orcamento">
                    <input type="text" id="nome" placeholder="Nome completo" required>
                    <input type="email" id="email" placeholder="E-mail" required>
                    <input type="tel" id="telefone" placeholder="Telefone / WhatsApp" required>

                    <select id="servico" required>
                        <option value="">Selecione o serviço desejado</option>
                        <option>Instalação de Rede Estruturada</option>
                        <option>Infraestrutura de Redes (Switches)</option>
                        <option>Instalação de Câmeras de Segurança (CFTV)</option>
                        <option>Soluções Residenciais e Prediais</option>
                        <option>Interfones e Vídeo Porteiros</option>
                        <option>Redes Wireless</option>
                        <option>Outros Assuntos</option>
                    </select>

                    <textarea rows="4" id="mensagem"
                        placeholder="Descreva sua necessidade ou outros detalhes importantes"></textarea>

                    <button class="btn" type="submit">
                        Solicitar Orçamento
                    </button>
                </form>
            </section>

            <footer class="footer footer-transparent">
                <p>© 2025 DR Tecnologia — Todos os direitos reservados.</p>
            </footer>
        </div>
    </section>

    <script src="js/validacao-form.js"></script>
    <script src="js/whatsapp.js"></script>
</body>

</html>
